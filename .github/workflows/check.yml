name: Check Eneba price

on:
  schedule:
    # TEMPORAL: cada hora, para la fase de prueba del resumen diario.
    # Volver a "0 */2 * * *" cuando termine esa fase.
    # Ojo: GitHub no garantiza la puntualidad de los cron, puede retrasarse
    # bastantes minutos si hay cola.
    - cron: "0 * * * *"
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

# Necesario para que el bot pueda commitear state.json de vuelta al repo.
permissions:
  contents: write

# Si una ejecucion se solapa con otra, deja terminar la anterior.
concurrency:
  group: eneba-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Comprobar precios
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Opcionales: se crean en Settings > Secrets and variables >
          # Variables. Si no existen, el script usa sus valores por defecto.
          RATIO_OBJETIVO: ${{ vars.RATIO_OBJETIVO }}
          UMBRAL_BAJADA_PCT: ${{ vars.UMBRAL_BAJADA_PCT }}
          UMBRAL_BAJADA_EUR: ${{ vars.UMBRAL_BAJADA_EUR }}
        run: python check_price.py

      - name: Generar grafico del historial
        # Si el grafico falla no queremos perder la comprobacion de precios,
        # que ya se hizo y ya notifico: por eso este paso no rompe el job.
        continue-on-error: true
        run: python grafico.py

      - name: Guardar el estado en el repo
        if: always() # tambien commitea el flag de fallo si el scraping se rompio
        run: |
          ARCHIVOS="state.json historial.json historial-*.png"
          if [[ -n "$(git status --porcelain -- $ARCHIVOS)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- $ARCHIVOS
            git commit -m "Actualizar estado, historial y grafico [skip ci]"
            git push
          else
            echo "Sin cambios en el estado, el historial ni los graficos."
          fi
